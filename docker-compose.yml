services:
  app:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    image: erp-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - erp-network

  queue:
    build:
      context: .
      dockerfile: .docker/php/Dockerfile
    image: erp-app
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./:/var/www
    networks:
      - erp-network


  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./.docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - erp-network
    depends_on:
      - app





networks:
  erp-network:
    driver: bridge


